name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, protocol-1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Read-only allowlist check
        run: node scripts/verify-readonly.mjs

      - name: Smoke script syntax
        run: node --check scripts/smoke.mjs

      - name: Build
        run: npm run build
